name: Dispatch page checks

# Free scheduler for the watcher, since Vercel Hobby cron only fires ~daily.
# Runs the dispatcher on an interval by calling its HTTP endpoint.
#
# Setup (repo Settings → Secrets and variables → Actions):
#   Variables → DISPATCH_URL = https://<your-app>.vercel.app/api/cron/dispatch
#   Secrets   → CRON_SECRET  = the same value set in the Vercel project
#
# Note: GitHub's scheduled runs are best-effort and can be delayed several
# minutes under load — fine for page-watching, not for to-the-minute timing.
# Need punctual sub-15-min checks? Use cron-job.org against the same URL.

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch: {}

# Don't stack overlapping runs if one is slow.
concurrency:
  group: dispatch
  cancel-in-progress: false

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger dispatcher
        env:
          DISPATCH_URL: ${{ vars.DISPATCH_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$DISPATCH_URL" ]; then
            echo "::error::Set the DISPATCH_URL repository variable."
            exit 1
          fi
          body=$(mktemp)
          code=$(curl -sS -o "$body" -w "%{http_code}" \
            -X POST "$DISPATCH_URL" \
            -H "Authorization: Bearer $CRON_SECRET")
          echo "HTTP $code"
          cat "$body"
          case "$code" in
            2*) : ;;
            *) echo "::error::Dispatcher returned $code"; exit 1 ;;
          esac
